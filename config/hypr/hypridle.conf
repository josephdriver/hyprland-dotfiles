general {
    lock_cmd = pkill -x hyprlock 2>/dev/null || true; /usr/bin/hyprlock
    after_sleep_cmd = /usr/bin/hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = pkill -x hyprlock 2>/dev/null || true; /usr/bin/hyprlock
}

listener {
    timeout = 330
    ignore_inhibit = true
    on-timeout = /usr/bin/hyprctl dispatch dpms off
    on-resume = /usr/bin/hyprctl dispatch dpms on
}
